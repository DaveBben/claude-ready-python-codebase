# This repository's own commit hooks: secrets and typos. The template's hooks
# are in its assets and run in the projects made from it.
# Install once with: uvx pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/crate-ci/typos
    rev: v1.50.3
    hooks:
      - id: typos
