[project]
name = "example-project"
dynamic = ["version"]
description = "A template python codebase that is designed to be AI first"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis>=6.120",
    "import-linter>=2.0",
    "mypy>=2.0",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "semgrep>=1.90",
    "vulture>=2.14",
]
# Opt-in: mutation testing. Slow, so it's NOT in `dev` or any commit/CI gate.
# Run on demand: `uv run --group mutation mutmut run`, then `mutmut results`.
# It answers what coverage cannot: whether the tests actually assert anything.
mutation = [
    "mutmut>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
example-project = "example_project.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/example_project"]

[tool.hatch.version]
path = "src/example_project/__init__.py"

[tool.ruff]
# Must equal the floor in requires-python. Set above it, `ruff check --fix`
# runs in the edit-time hook and rewrites code into syntax the supported
# interpreter cannot parse. Change these two together or neither.
target-version = "py312"
src = ["src"]
# Generated by `vulture --make-whitelist`; it is a list of bare attribute
# references, which is not code ruff should have an opinion about.
extend-exclude = ["vulture_whitelist.py"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "RUF", "PTH", "PERF", "S",
    "A", "C4", "DTZ", "PIE", "RET", "TC", "ARG", "FURB", "TRY", "PLE",
    "PLW", "PLR", "BLE", "C90", "N", "PGH", "PT", "TID", "G", "LOG",
    "EM", "RSE", "SLF", "FBT", "FLY", "T20", "ANN", "ERA",
]
ignore = [
    # Line length is the formatter's job.
    "E501",
    # EM101/EM102 force `msg = "..."` on its own line before every raise, and
    # TRY003 objects to the message being there at all. Together they turn one
    # raise into three lines of ceremony, in tests as much as in src.
    "EM101",
    "EM102",
    "TRY003",
    # A002/A003 reject arguments and attributes named `id`, `type`, `input`.
    # `id` on a database row or an API payload is not a mistake. A001 stays on,
    # so rebinding a builtin as a local variable is still an error.
    "A002",
    "A003",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-annotations]
# ANN401 bans `Any`, which is the one gap mypy --strict leaves. Keep it for real
# parameters, where an alternative almost always exists, and allow it on
# *args/**kwargs, where one frequently does not.
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "ARG001", "PLR2004"]
"src/example_project/__main__.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["example_project"]

[tool.mypy]
mypy_path = "src"
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
]

[tool.importlinter]
# Architectural tests, and the only record of the intended shape of the package.
# ruff and mypy see one file at a time; nothing else in the gate can tell you a
# boundary moved. Run with `uv run lint-imports`.
#
# What each module owns:
#   __main__.py    Process concerns: the environment, setup_logging, the exit
#                  code. No business logic.
#   logger.py      Logging configuration and the JSON formatter. Imports nothing
#                  first-party.
#   exceptions.py  The hierarchy rooted at ExampleProjectError. Types only.
#
# Allowed dependencies, and nothing else:
#   __main__ -> logger, exceptions
#   <your module> -> logger, exceptions
#
# Adding an import that crosses a boundary means changing a contract here, not
# routing around one. Each contract's `name` is the rule in plain English, so
# the failure message reads as the statement that was broken. After adding one,
# break the boundary on purpose once and confirm it fails.
root_package = "example_project"

[[tool.importlinter.contracts]]
# __main__ -> logger is the only first-party import in the package today.
name = "The entry point sits above the library modules"
type = "layers"
layers = [
    "example_project.__main__",
    "example_project.logger",
    "example_project.exceptions",
]

[[tool.importlinter.contracts]]
# The layers contract above only forbids logger -> __main__ and
# exceptions -> anything above. This forbids logger <-> exceptions in BOTH
# directions: a logger that raises project errors and an exception module that
# logs are a cycle waiting for the first module to need the other.
name = "The leaf modules are independent of each other"
type = "independence"
modules = [
    "example_project.logger",
    "example_project.exceptions",
]

[tool.mutmut]
# Mutate the package; the suite (pytest testpaths) runs to catch the mutants.
# Opt-in. mutmut 3 config name is source_paths, not the older paths_to_mutate.
source_paths = ["src/"]

[tool.vulture]
# vulture_whitelist.py holds the confirmed false positives. Without it the
# only moves on one are deleting live code or lowering min_confidence.
# Regenerate with: uv run vulture --make-whitelist > vulture_whitelist.py
paths = ["src", "tests", "vulture_whitelist.py"]
ignore_decorators = ["@pytest.fixture"]
min_confidence = 60

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers --strict-config"
filterwarnings = ["error"]
xfail_strict = true
markers = ["slow", "integration", "property"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
