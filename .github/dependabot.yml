version: 2
# The template's own dependabot.yml is for the projects made from it; GitHub
# reads only this one. cooldown: propose a release only once it is 7 days old,
# matching exclude-newer in the template's pyproject.toml.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: uv
    directory: /skills/python-template/python-template/assets/project
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /skills/python-template/python-template/assets/project
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /skills/python-template/python-template/assets/project
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
