name: CI

# The template's own CI lives in its assets and runs only in projects made from
# it, so this runs ./check --full: a project made by the skill, with its own
# ./check and pip-audit, on each Python version the template supports.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # Run every version to completion so a floor-only break is visible.
      fail-fast: false
      matrix:
        # The template's support floor (requires-python), its dev version
        # (.python-version) and the newest release.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: skills/python-template/python-template/assets/project/uv.lock
          python-version: ${{ matrix.python-version }}

      - run: ./check --full
